name: Nightly
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '.gitignore']
permissions:
  contents: write
  packages: read
concurrency:
  group: nightly
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/build-apks.yml
    with:
      ref: ${{ github.sha }}
      nightly: true
    secrets: inherit
  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: signed-apks-*
          merge-multiple: true
          path: apks
      - name: Publish nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest apks/*.apk --target "$BUILD_COMMIT" --prerelease --title 'Nightly Build' --notes "Personal nightly build from $BUILD_COMMIT."
